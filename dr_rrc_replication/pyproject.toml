[project]
name = "dr-rcc-replication"
version = "0.1.0"
description = "SFT-trained replication of the RRC (Resource-Rational Contractualism) moral-reasoning experiment (context distillation)"
requires-python = ">=3.10"

# Lightweight deps needed for data prep + eval scoring. These run CPU-only, so
# you can prepare/inspect data locally without the GPU stack.
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "scikit-learn>=1.3",
    "numpy>=1.26,<2",
]

# GPU training/inference stack. Install on RunPod with:  uv sync --extra gpu
# (If the RunPod base image already ships a CUDA torch, prefer:
#   uv venv --system-site-packages && uv sync --extra gpu --no-build-isolation)
[project.optional-dependencies]
gpu = [
    "torch>=2.3,<2.6",
    "transformers>=4.44,<4.46",
    "trl>=0.9,<0.11",
    "peft>=0.12,<0.14",
    "accelerate>=0.33",
    "datasets>=2.20",
    "bitsandbytes>=0.43; sys_platform == 'linux'",
    "wandb>=0.17",
]

# Faster LoRA (optional). Install with:  uv sync --extra gpu --extra unsloth
# unsloth is picky about torch/triton versions; the trainer auto-falls back to
# the plain transformers path if it can't be imported.
unsloth = [
    "unsloth>=2024.8",
    "unsloth-zoo",
]

[tool.uv]
package = false
