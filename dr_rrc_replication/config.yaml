# dr_rcc_replication config. Edit for smoke vs real runs.

# --- Data ---
data_repo_url: "https://github.com/mint-philosophy/RRC_experiments.git"
data_dir: "data/RRC_experiments"          # where download_data.py clones to
out_dir: "artifacts"                        # jsonl splits, adapters, metrics land here

models: ["DeepSeek-R1"]                     # which result sheets to pull traces from
condition: "rrc_only"                       # rrc_only | best_per_vignette
strip_spec: true                            # context distillation: remove RRC spec from SFT input
split_mode: "random"                        # random | stakes_generalisation
split_ratios: [0.8, 0.1, 0.1]              # train/val/test (random mode)
seed: 0

# --- Model / LoRA ---
base_model: "deepseek-ai/DeepSeek-R1-Distill-Qwen-7B"
use_unsloth: true                           # faster/lower-VRAM LoRA; auto-falls back to transformers
load_in_4bit: false                         # QLoRA fallback for tight VRAM
max_seq_len: 1536                           # bump to 2048 if prepare_data reports p95 > this
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

# --- Training ---
epochs: 3
learning_rate: 1.0e-4
per_device_batch_size: 2
grad_accum_steps: 8                         # effective batch = 2 * 8 = 16
warmup_ratio: 0.03
weight_decay: 0.0
logging_steps: 5
eval_steps: 25
save_best: true                             # keep best-by-val-loss adapter

# --- Eval ---
eval_baselines: ["no_thinking", "rrc_incontext"]  # local baselines to generate; paper-RRC is a free lookup
max_new_tokens: 2048                        # room for verbose baseline CoT before the answer
gen_temperature: 0.0                        # greedy for reproducibility

# --- Smoke test (overrides applied when smoke: true) ---
smoke: false
smoke_overrides:
  base_model: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
  epochs: 1
  max_seq_len: 1024
  n_train: 20
  n_eval: 10
