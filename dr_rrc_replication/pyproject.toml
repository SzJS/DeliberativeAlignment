[project]
name = "dr-rcc-replication"
version = "0.1.0"
description = "SFT-trained replication of the RRC (Resource-Rational Contractualism) moral-reasoning experiment (context distillation)"
requires-python = ">=3.10"

# Lightweight deps needed for data prep + eval scoring. These run CPU-only, so
# you can prepare/inspect data locally without the GPU stack.
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "scikit-learn>=1.3",
    "numpy>=1.26,<2",
    "python-dotenv>=1.0",
]

# GPU training/inference stack. Install on RunPod with:  uv sync --extra gpu
# (If the RunPod base image already ships a CUDA torch, prefer:
#   uv venv --system-site-packages && uv sync --extra gpu --no-build-isolation)
#
# These versions are pinned as a *coherent set* that makes unsloth train
# deepseek-ai/DeepSeek-R1-Distill-Qwen-7B (see the `unsloth` extra). The
# constraints are load-bearing — loosening any of them reintroduces a real
# breakage we already hit:
#   - torch 2.5.x: the version unsloth 2025.3.19 was built against. torch>=2.10
#     (what the *latest* unsloth wants) is a multi-GB CUDA-stack swap, no gain here.
#   - transformers 4.50.x: new enough that unsloth can patch the R1-Distill (Qwen2)
#     model, old enough to avoid Qwen3. transformers>=4.51 ships `models.qwen3`,
#     which only unsloth>=2025.4 imports; <4.46 is too old for R1-Distill patching.
#   - accelerate 1.5.x: unsloth-zoo re-compiles accelerate's `Accelerator.prepare`
#     source in a restricted namespace. accelerate>=1.6 added a `FP8BackendType`
#     reference in that method -> `NameError` at trainer.train(). 1.5.x predates it.
#   - trl/peft bumped to match transformers 4.50 (older trl imports break on it).
# The non-unsloth transformers+peft fallback path (use_unsloth: false) also works
# with this set; bf16 7B needs gradient checkpointing to fit 24GB (handled in train.py).
[project.optional-dependencies]
gpu = [
    "torch>=2.5,<2.6",
    "transformers>=4.50,<4.51",
    "trl>=0.15,<0.16",
    "peft>=0.19,<0.20",
    "accelerate>=1.5,<1.6",   # >=1.6 breaks unsloth-zoo's re-compiled prepare() (FP8BackendType)
    "datasets>=2.20",
    "bitsandbytes>=0.43; sys_platform == 'linux'",
    "wandb>=0.17",
]

# Faster/lower-VRAM LoRA (optional). Install with:  uv sync --extra gpu --extra unsloth
# unsloth is extremely version-sensitive; the trainer auto-falls back to the plain
# transformers path if it can't be imported. These exact versions are the only ones
# that both (a) know DeepSeek-R1-Distill-Qwen-7B and (b) run on the torch 2.5 /
# transformers 4.50 / accelerate 1.5 set above:
#   - unsloth>=2025.4 requires transformers>=4.51 (imports transformers.models.qwen3).
#   - the latest unsloth requires torch 2.10 + transformers 5.5 (a full stack swap
#     that also breaks train.py's Trainer usage).
#   - the pyproject-default unsloth 2024.10.x predates R1-Distill and NotImplementedErrors.
unsloth = [
    "unsloth==2025.3.19",
    "unsloth-zoo==2025.3.17",
]

[tool.uv]
package = false
